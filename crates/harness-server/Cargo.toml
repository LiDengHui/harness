[package]
name = "harness-server"
description = "axum HTTP + WebSocket harness server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Compiles `web/dist` into the binary, so a release ships as one file. Off by
# default because it makes every Rust rebuild depend on the UI having been
# built first, which is the wrong trade while iterating on the server.
embed-ui = ["dep:rust-embed"]

[dependencies]
harness-core.workspace = true
harness-agent.workspace = true
harness-guardrails.workspace = true
harness-llm.workspace = true
harness-memory.workspace = true
harness-orchestrator.workspace = true
harness-skills.workspace = true
harness-tools.workspace = true
harness-workflows.workspace = true

axum.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true

rust-embed = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
