[package]
name = "harness-cli"
description = "harness command line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "dhs"
path = "src/main.rs"

[features]
# A globally installed `dhs` has no checkout next to it, so the UI must be
# compiled in. Off by default because it makes `web/dist` a build-time
# dependency, which breaks a fresh clone that has not run `pnpm build`.
embed-ui = ["harness-server/embed-ui"]

[dependencies]
harness-core.workspace = true
harness-agent.workspace = true
harness-guardrails.workspace = true
harness-llm.workspace = true
harness-mcp.workspace = true
harness-memory.workspace = true
harness-orchestrator.workspace = true
harness-sandbox.workspace = true
harness-server.workspace = true
harness-skills.workspace = true
harness-tools.workspace = true
harness-workflows.workspace = true

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
